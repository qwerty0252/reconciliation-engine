version: "3.9"

services:
  # ── Infrastructure ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bankops_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bankops_reconciliation}
      POSTGRES_USER: ${POSTGRES_USER:-bankops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankops_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bankops_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bankops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bankops_secret}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bankops_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application Services ────────────────────────────────────────
  ingestion:
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
    container_name: bankops_ingestion
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankops}:${POSTGRES_PASSWORD:-bankops_secret}@postgres:5432/${POSTGRES_DB:-bankops_reconciliation}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-bankops}:${RABBITMQ_PASSWORD:-bankops_secret}@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  reconciliation:
    build:
      context: .
      dockerfile: docker/reconciliation.Dockerfile
    container_name: bankops_reconciliation
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankops}:${POSTGRES_PASSWORD:-bankops_secret}@postgres:5432/${POSTGRES_DB:-bankops_reconciliation}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-bankops}:${RABBITMQ_PASSWORD:-bankops_secret}@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  alerts:
    build:
      context: .
      dockerfile: docker/alerts.Dockerfile
    container_name: bankops_alerts
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankops}:${POSTGRES_PASSWORD:-bankops_secret}@postgres:5432/${POSTGRES_DB:-bankops_reconciliation}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: bankops_api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankops}:${POSTGRES_PASSWORD:-bankops_secret}@postgres:5432/${POSTGRES_DB:-bankops_reconciliation}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Observability ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: bankops_prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: bankops_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  grafana_data:
